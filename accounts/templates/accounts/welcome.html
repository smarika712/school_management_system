<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 40px 20px; }
        .container { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #1a5276, #27ae60); padding: 32px; text-align: center; }
        .header h1 { color: #fff; margin: 0; font-size: 22px; }
        .body { padding: 32px; color: #2c3e50; line-height: 1.7; }
        .footer { padding: 20px 32px; text-align: center; font-size: 12px; color: #95a5a6; border-top: 1px solid #ecf0f1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>Welcome to {{ school_name }}!</h1></div>
        <div class="body">
            <p>Hi {{ user.get_full_name|default:user.username }},</p>
            <p>Your email is verified and your account is active.</p>
            <p>You can now log in and access all features of the school portal.</p>
            <p>Best regards,<br>The {{ school_name }} Team</p>
        </div>
        <div class="footer"><p>&copy; 2024 {{ school_name }}. All rights reserved.</p></div>
    </div>
</body>
</html>
